name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m agentloop.benchmark
      - run: python -m compileall -q agentloop
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check web/app.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-lock.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser flow checks
        run: |
          python -m agentloop --db /tmp/agentloop-ci.db > /tmp/agentloop-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/api/config && break
            sleep 1
          done
          npm run test:browser
